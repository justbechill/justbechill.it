<!doctype html>
<html lang="en">
    <head>

        <main>

            <div class="navbar">

                <a href="../music/index.html">Music</a>

            <!-- LOS ANGELES GALLERY -->
            <div class="row" style="max-height: 50%">

            <div class="row" style="max-height: 50%">
                <a href="../photos/road-trip/index.html">
                    <div
                        class="img-wrapper"
                        style="
                            background-image: url(../photos/road-trip/compressed/01.webp);
                            background-position: 50% 100%;

                    ></div>
                    <div class="info" style="width: 50%">
