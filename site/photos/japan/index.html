<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Photos - Japan Trip</title>
        <link rel="stylesheet" href="/style.css" />
        <link rel="icon" href="/photos/icon.svg" />
    </head>

    <body>
        <main>
            <div class="title" style="background-image: url('./compressed/31.webp'); background-position: center; height: 25%;">
                <h1>Japan Trip</h1>
                <p>Summer 2025</p>
            </div>

            <div class="row" style="max-height: 30%">
                <div class="info" style="width: 100%; padding: 40px 0;">
                    <p>
                        These are from my trip to Japan in Summer 2025. I bought a Fujifilm X-T1 (amazingly cheap camera)
                        and had a pretty good time.
                    </p>
                </div>
            </div>

            <div id="photo-grid"></div>

            <div id="photoModal" class="modal">
                <span class="close">&times;</span>
                <img class="modal-content" id="expandedImg">
                <div id="caption"></div>
            </div>
        </main>

        <script src="/script.js"></script>
        <script src="/footer.js"></script>
    </body>
</html>
