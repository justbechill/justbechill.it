<!doctype html>
<html lang="en">
    <head>
        <title>Photos - Los Angeles</title>
        <link rel="stylesheet" href="/style.css" />
        <link rel="icon" href="/photos/icon.svg" />

        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
    </head>

    <body>
        <main>
            <!-- TITLE -->
            <div
                class="title"
                style="
                    background-color: #1b1b1b;
                    background-position-y: 50%;
                    max-height: 40%;
                "
            >
                <h3>Los Angeles</h3>
                Summer 2025

                <p>
                    <br />
                    <br />
                    With the summer of 2025 being the last summer before I leave
                    for college, I wanted to explore some of the best spots
                    around Los Angeles before I leave. These are all from
                    various locations around LA County taken on my Fujifilm X-T1
                    27mm.
                </p>
            </div>

            <div id="photo-grid"></div>

            <div id="photoModal" class="modal">
                <span class="close">&times;</span>
                <img class="modal-content" id="expandedImg">
                <div id="caption"></div>
            </div>
        </main>

        <script src="/script.js"></script>
        <script src="/footer.js"></script>
    </body>
</html>
